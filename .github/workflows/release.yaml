name: "Release"
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build-extension:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
          # last Intel macOS image, supported until August 2027
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-14
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make loadable-release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/release/*

  dist:
    runs-on: ubuntu-latest
    needs:
      [
        build-extension,
      ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/asg017/sqlite-dist/releases/download/v0.0.1-alpha.19/sqlite-dist-installer.sh | sh
      - run: sqlite-dist ./sqlite-dist.toml --input dist/ --output distx/ --version $(cat VERSION)
      - run: |
          gh release upload ${{ github.ref_name }} \
            distx/github_releases/* \
            distx/spm/* \
            distx/sqlpkg/* \
            distx/checksums.txt \
            distx/sqlite-dist-manifest.json \
            distx/install.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v3
        with:
          node-version: "16"
          registry-url: "https://registry.npmjs.org"
      - run: |
          npm publish --access public distx/npm/sqlite-jiff-darwin-arm64.tar.gz
          npm publish --access public distx/npm/sqlite-jiff-darwin-x64.tar.gz
          npm publish --access public distx/npm/sqlite-jiff-linux-x64.tar.gz
          npm publish --access public distx/npm/sqlite-jiff-linux-arm64.tar.gz
          npm publish --access public distx/npm/sqlite-jiff-windows-x64.tar.gz
          npm publish --access public distx/npm/sqlite-jiff.tar.gz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
      - run: |
          for file in distx/gem/*; do
            gem push  "$file"
          done
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install twine
      - run: |
          uv publish distx/pip/*
          uv publish distx/datasette/*
          uv publish distx/sqlite_utils/*
        env:
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}