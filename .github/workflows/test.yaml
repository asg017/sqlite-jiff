name: "Test"
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build-extension:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
          # last Intel macOS image, supported until August 2027
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-14
            target: macos-aarch64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: asg017/setup-solite@main
      - run: make loadable
      - run: make test-api
      - run: make docs-check
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-jiff-${{ matrix.target }}-extension
          path: dist/*
